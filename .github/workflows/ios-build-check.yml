name: iOS build check

# Builds the iPhone app on a macOS runner WITHOUT code signing, to prove the
# iOS project (Podfile, plugins, Info.plist, Swift code) compiles. The result
# can't be installed on a phone - real iPhone builds need an Apple Developer
# account and signing (Xcode or Codemagic), see mobile/STORE_RELEASE_GUIDE.md.

on:
  push:
    tags:
      - 'app-v*'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: stable
          cache: true

      - name: Build iOS (no codesign)
        working-directory: mobile
        run: |
          flutter pub get
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL="${{ vars.API_BASE_URL || 'https://flatcare.in/api/v1' }}"
