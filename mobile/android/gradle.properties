org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# QR scanner (gatekeeper's Gate Pass scan): use ML Kit's barcode engine from
# Google Play Services instead of bundling it (~5.8 MB of native lib + models)
# into every resident's APK. AndroidManifest asks Play Services to download
# it at install time so the first scan doesn't wait.
dev.steenbakker.mobile_scanner.useUnbundled=true
